<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <style>
    .title { font: bold 48px 'Helvetica Neue', Arial, sans-serif; fill: #333; }
    .subtitle { font: italic 28px 'Helvetica Neue', Arial, sans-serif; fill: #555; }
    .cell-title { font: bold 36px 'Helvetica Neue', Arial, sans-serif; fill: #333; }
    .cell-text { font: 24px 'Helvetica Neue', Arial, sans-serif; fill: #444; }
    .sector { font: bold 32px 'Helvetica Neue', Arial, sans-serif; fill: #888; writing-mode: vertical-rl; }
    .sector-label { font: bold 32px 'Helvetica Neue', Arial, sans-serif; fill: #888; }
  </style>
  <rect width="1200" height="900" fill="#fdf9f2" rx="30" ry="30" />
  <text x="600" y="90" text-anchor="middle" class="title">Standard Model of Elementary Particles</text>
  <text x="600" y="140" text-anchor="middle" class="subtitle">Mass, charge, and spin encoded in the Compute-God lattice</text>

  <g transform="translate(150,200)">
    <!-- Column headers -->
    <text x="150" y="-40" class="sector-label" text-anchor="middle">Generation I</text>
    <text x="450" y="-40" class="sector-label" text-anchor="middle">Generation II</text>
    <text x="750" y="-40" class="sector-label" text-anchor="middle">Generation III</text>

    <!-- Row labels -->
    <text x="-120" y="80" class="sector" text-anchor="middle">Quarks</text>
    <text x="-120" y="380" class="sector" text-anchor="middle">Leptons</text>
    <text x="-120" y="680" class="sector" text-anchor="middle">Gauge / Higgs</text>

    <!-- Helper function defined through manual layout -->
    <!-- Quark cells -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="240" height="180" rx="30" ry="30" fill="#e8d4f3" stroke="#c092e0" stroke-width="4" />
      <text x="120" y="70" text-anchor="middle" class="cell-title">up (u)</text>
      <text x="120" y="120" text-anchor="middle" class="cell-text">mass ≈ 2.2 MeV</text>
      <text x="120" y="150" text-anchor="middle" class="cell-text">charge +2/3</text>
    </g>
    <g transform="translate(300,0)">
      <rect x="0" y="0" width="240" height="180" rx="30" ry="30" fill="#e8d4f3" stroke="#c092e0" stroke-width="4" />
      <text x="120" y="70" text-anchor="middle" class="cell-title">charm (c)</text>
      <text x="120" y="120" text-anchor="middle" class="cell-text">mass ≈ 1.27 GeV</text>
      <text x="120" y="150" text-anchor="middle" class="cell-text">charge +2/3</text>
    </g>
    <g transform="translate(600,0)">
      <rect x="0" y="0" width="240" height="180" rx="30" ry="30" fill="#e8d4f3" stroke="#c092e0" stroke-width="4" />
      <text x="120" y="70" text-anchor="middle" class="cell-title">top (t)</text>
      <text x="120" y="120" text-anchor="middle" class="cell-text">mass ≈ 173 GeV</text>
      <text x="120" y="150" text-anchor="middle" class="cell-text">charge +2/3</text>
    </g>

    <g transform="translate(0,200)">
      <rect x="0" y="0" width="240" height="180" rx="30" ry="30" fill="#f8e2dd" stroke="#ec9a8a" stroke-width="4" />
      <text x="120" y="70" text-anchor="middle" class="cell-title">down (d)</text>
      <text x="120" y="120" text-anchor="middle" class="cell-text">mass ≈ 4.7 MeV</text>
      <text x="120" y="150" text-anchor="middle" class="cell-text">charge −1/3</text>
    </g>
    <g transform="translate(300,200)">
      <rect x="0" y="0" width="240" height="180" rx="30" ry="30" fill="#f8e2dd" stroke="#ec9a8a" stroke-width="4" />
      <text x="120" y="70" text-anchor="middle" class="cell-title">strange (s)</text>
      <text x="120" y="120" text-anchor="middle" class="cell-text">mass ≈ 95 MeV</text>
      <text x="120" y="150" text-anchor="middle" class="cell-text">charge −1/3</text>
    </g>
    <g transform="translate(600,200)">
      <rect x="0" y="0" width="240" height="180" rx="30" ry="30" fill="#f8e2dd" stroke="#ec9a8a" stroke-width="4" />
      <text x="120" y="70" text-anchor="middle" class="cell-title">bottom (b)</text>
      <text x="120" y="120" text-anchor="middle" class="cell-text">mass ≈ 4.18 GeV</text>
      <text x="120" y="150" text-anchor="middle" class="cell-text">charge −1/3</text>
    </g>

    <!-- Lepton cells -->
    <g transform="translate(0,400)">
      <rect x="0" y="0" width="240" height="180" rx="30" ry="30" fill="#d8f1d6" stroke="#95d69c" stroke-width="4" />
      <text x="120" y="70" text-anchor="middle" class="cell-title">electron (e)</text>
      <text x="120" y="120" text-anchor="middle" class="cell-text">mass ≈ 0.511 MeV</text>
      <text x="120" y="150" text-anchor="middle" class="cell-text">charge −1</text>
    </g>
    <g transform="translate(300,400)">
      <rect x="0" y="0" width="240" height="180" rx="30" ry="30" fill="#d8f1d6" stroke="#95d69c" stroke-width="4" />
      <text x="120" y="70" text-anchor="middle" class="cell-title">muon (μ)</text>
      <text x="120" y="120" text-anchor="middle" class="cell-text">mass ≈ 105.7 MeV</text>
      <text x="120" y="150" text-anchor="middle" class="cell-text">charge −1</text>
    </g>
    <g transform="translate(600,400)">
      <rect x="0" y="0" width="240" height="180" rx="30" ry="30" fill="#d8f1d6" stroke="#95d69c" stroke-width="4" />
      <text x="120" y="70" text-anchor="middle" class="cell-title">tau (τ)</text>
      <text x="120" y="120" text-anchor="middle" class="cell-text">mass ≈ 1.78 GeV</text>
      <text x="120" y="150" text-anchor="middle" class="cell-text">charge −1</text>
    </g>

    <g transform="translate(0,600)">
      <rect x="0" y="0" width="240" height="180" rx="30" ry="30" fill="#d8e9fa" stroke="#8ab7e8" stroke-width="4" />
      <text x="120" y="70" text-anchor="middle" class="cell-title">νₑ</text>
      <text x="120" y="120" text-anchor="middle" class="cell-text">mass &lt; 2.3 eV</text>
      <text x="120" y="150" text-anchor="middle" class="cell-text">charge 0</text>
    </g>
    <g transform="translate(300,600)">
      <rect x="0" y="0" width="240" height="180" rx="30" ry="30" fill="#d8e9fa" stroke="#8ab7e8" stroke-width="4" />
      <text x="120" y="70" text-anchor="middle" class="cell-title">ν_μ</text>
      <text x="120" y="120" text-anchor="middle" class="cell-text">mass &lt; 0.17 MeV</text>
      <text x="120" y="150" text-anchor="middle" class="cell-text">charge 0</text>
    </g>
    <g transform="translate(600,600)">
      <rect x="0" y="0" width="240" height="180" rx="30" ry="30" fill="#d8e9fa" stroke="#8ab7e8" stroke-width="4" />
      <text x="120" y="70" text-anchor="middle" class="cell-title">ν_τ</text>
      <text x="120" y="120" text-anchor="middle" class="cell-text">mass &lt; 18.2 MeV</text>
      <text x="120" y="150" text-anchor="middle" class="cell-text">charge 0</text>
    </g>
  </g>

  <!-- Gauge bosons on the right -->
  <g transform="translate(960,220)">
    <rect x="0" y="0" width="200" height="180" rx="30" ry="30" fill="#fff2b3" stroke="#f0c15b" stroke-width="4" />
    <text x="100" y="70" text-anchor="middle" class="cell-title">γ</text>
    <text x="100" y="120" text-anchor="middle" class="cell-text">photon</text>
    <text x="100" y="150" text-anchor="middle" class="cell-text">mass 0</text>
  </g>
  <g transform="translate(960,420)">
    <rect x="0" y="0" width="200" height="180" rx="30" ry="30" fill="#fff2b3" stroke="#f0c15b" stroke-width="4" />
    <text x="100" y="70" text-anchor="middle" class="cell-title">Z⁰</text>
    <text x="100" y="120" text-anchor="middle" class="cell-text">Z boson</text>
    <text x="100" y="150" text-anchor="middle" class="cell-text">mass ≈ 91 GeV</text>
  </g>
  <g transform="translate(960,620)">
    <rect x="0" y="0" width="200" height="180" rx="30" ry="30" fill="#fff2b3" stroke="#f0c15b" stroke-width="4" />
    <text x="100" y="70" text-anchor="middle" class="cell-title">W±</text>
    <text x="100" y="120" text-anchor="middle" class="cell-text">W boson</text>
    <text x="100" y="150" text-anchor="middle" class="cell-text">mass ≈ 80 GeV</text>
  </g>
  <g transform="translate(960,70)">
    <rect x="0" y="0" width="200" height="120" rx="30" ry="30" fill="#ffe6f5" stroke="#f2a5d0" stroke-width="4" />
    <text x="100" y="65" text-anchor="middle" class="cell-title">H</text>
    <text x="100" y="100" text-anchor="middle" class="cell-text">Higgs boson</text>
  </g>
  <g transform="translate(150,820)">
    <text x="0" y="0" class="subtitle">Data bars denote approximate rest masses; charges and spins are encoded for Compute-God validation.</text>
  </g>
</svg>
